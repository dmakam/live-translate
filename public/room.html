<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1430">
<title>English translation &middot; Live Translate</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; font-size: 18px; }
  header.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px clamp(14px, 3vw, 40px);
    border-bottom: 1px solid var(--line); background: rgba(7, 11, 24, .75); backdrop-filter: blur(12px); }
  .ttl { min-width: 0; }
  .ttl b { display: block; font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ttl span { font-size: 15px; color: var(--mute); }
  .live-tag { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
  .wrap { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; padding: 18px clamp(14px, 3vw, 40px); min-height: 0; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .panel { display: none; }
    .panel.open { display: block; position: fixed; inset: auto 10px 10px 10px; z-index: 5; max-height: 85vh; overflow-y: auto; }
  }
  #feed { height: 100%; padding: 10px 4px 35vh; --fs: 34px; }
  #feed .sub { font-weight: 600; }
  .settings-btn { display: none; } @media (max-width: 900px) { .settings-btn { display: inline-flex; } }

  /* big "tap to hear" call to action */
  .hear { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); translate: -50% 0; z-index: 4;
    font-size: 22px; padding: 20px 34px; border-radius: 999px; white-space: nowrap; }
  .hear.on { background: linear-gradient(135deg, var(--aqua), var(--acc)); }

  /* waiting screen */
  .waiting { text-align: center; padding: 8vh 10px 0; }
  .waiting .big { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -.02em; margin: 10px 0; }
  .waiting .when { font-size: 22px; color: #cfe0ff; }
  .waiting .count { font-size: clamp(40px, 8vw, 72px); font-weight: 800; margin: 18px 0 8px;
    background: linear-gradient(90deg, #fff, #b9c8ff, var(--aqua)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .waiting p { font-size: 19px; color: #c9d1ff; line-height: 1.5; max-width: 560px; margin: 14px auto; }

  /* settings */
  .set { display: grid; gap: 22px; }
  .set .label { font-size: 13px; }
  .stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 10px; }
  .stepper button { font: inherit; font-size: 26px; font-weight: 800; height: 56px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: #fff; cursor: pointer; }
  .stepper button:active { transform: scale(.96); }
  .stepper .val { text-align: center; font-size: 18px; font-weight: 700; }
  .set .help { font-size: 14px; color: var(--mute); margin: 8px 0 0; line-height: 1.45; }
  .set select { font-size: 16px; padding: 12px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 17px; font-weight: 600; }
  .toggle input { width: 26px; height: 26px; accent-color: var(--acc); }
  .paused { color: var(--warn); }
  #listen.pulse { animation: pulse 1.6s infinite; }

  /* event video (muted), beside the English on computers, above it on phones */
  .side { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .side > .panel { flex: 1 1 auto; min-height: 0; overflow-y: auto; }   /* video stays put, settings scroll */
  .vbox { flex: none; }
  .vbox { display: none; }
  body[data-video="small"] .vbox, body[data-video="medium"] .vbox, body[data-video="large"] .vbox { display: block; }
  /* Large: the video across the top, the English underneath, settings stay on the right */
  @media (min-width: 901px) {
    body[data-video="large"] .side { display: contents; }
    body[data-video="large"] .wrap { grid-template-rows: auto minmax(0, 1fr); row-gap: 14px; }
    body[data-video="large"] .vbox { grid-column: 1; grid-row: 1; }
    body[data-video="large"] #feed { grid-column: 1; grid-row: 2; padding-bottom: 120px; }
    body[data-video="large"] .side > .panel { grid-column: 2; grid-row: 1 / span 2; }
    body[data-video="large"] .vframe { width: min(100%, calc(50vh * 16 / 9)); margin: 0 auto; }
    body[data-video="large"] .vnote { text-align: center; }
  }
  body[data-video="medium"] .wrap { grid-template-columns: minmax(0, 1fr) min(600px, 44vw); }
  .vframe { position: relative; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000;
    border: 1px solid var(--line); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); }
  .vframe video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .vframe .vwait { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 12px; color: #c9d1ff; font-size: 15px; }
  .vnote { font-size: 13px; color: var(--mute); margin-top: 6px; }
  @media (max-width: 900px) {
    .side { display: contents; }
    body[data-video="small"] .wrap, body[data-video="medium"] .wrap, body[data-video="large"] .wrap { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
    .vbox { order: -1; }
    body[data-video="small"] .vbox { width: 55%; margin-left: auto; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="ttl">
    <b id="title">English translation</b>
    <span id="state"><span class="live-tag"><span class="dot" id="dot"></span><span id="stateText">Connecting...</span></span></span>
  </div>
  <div class="row" style="gap:8px; flex-wrap:nowrap">
    <button class="btn small ghost hidden" id="delayTag" style="color:var(--warn)"></button>
    <button class="btn ghost settings-btn" id="gear">Settings</button>
  </div>
</header>

<div class="wrap">
  <div class="subs" id="feed"></div>

  <div class="side">
  <div class="vbox" id="vbox">
    <div class="vframe"><video id="vid" muted autoplay playsinline disablepictureinpicture></video><div class="vwait" id="vwait">Connecting the video...</div></div>
    <div class="vnote">&#128263; Video sound is off &middot; you hear the English</div>
  </div>
  <aside class="card panel" id="panel">
    <div class="set">
      <div>
      <div class="hidden" id="videoSet">
        <p class="label">Video</p>
        <div class="stepper"><button id="vsDown" aria-label="Smaller video">&minus;</button><div class="val" id="vsVal"></div><button id="vsUp" aria-label="Bigger video">+</button></div>
      </div>
        <p class="label">Text size</p>
        <div class="stepper"><button id="szDown" aria-label="Smaller text">A&minus;</button><div class="val" id="szVal"></div><button id="szUp" aria-label="Bigger text">A+</button></div>
      </div>
      <div>
        <p class="label">Speaking speed</p>
        <div class="stepper"><button id="rtDown" aria-label="Slower">&minus;</button><div class="val" id="rtVal"></div><button id="rtUp" aria-label="Faster">+</button></div>
      </div>
      <div>
        <p class="label">Voice</p>
        <div class="row" style="flex-wrap:nowrap">
          <select id="voice" style="flex:1; min-width:0"></select>
          <button class="btn small ghost" id="vtest">&#9654; Test</button>
        </div>
        <p class="help" id="vhint"></p>
      </div>
      <div>
        <p class="label">English arrives too early?</p>
        <div class="stepper"><button id="dlDown" aria-label="Less delay">&minus;</button><div class="val" id="dlVal"></div><button id="dlUp" aria-label="More delay">+</button></div>
        <p class="help">Watching on YouTube? It runs behind live, so add a delay until the English matches the video.</p>
      </div>
      <label class="toggle">Show the Hindi too <input type="checkbox" id="hiBox"></label>
      <button class="btn small ghost" id="dl">&#11015; Save the transcript</button>
      <button class="btn settings-btn" id="closePanel" style="justify-content:center">Done</button>
    </div>
  </aside>
  </div>
</div>

<div id="soundHelp" class="notice hidden" style="position:fixed; left:12px; right:12px; bottom:96px; z-index:6; font-size:17px; background:#2a2210; display:flex; gap:12px; align-items:flex-start">
  <span id="soundHelpText" style="flex:1"></span><button class="btn small ghost" id="soundHelpClose">OK</button>
</div>
<button class="btn hear" id="listen">&#128264; Tap to hear English</button>

<script type="module">
import { $, ReadAloud, voicePicker, transcriptText, download } from '/js/common.js';

const code = location.pathname.split('/').pop().toUpperCase();
const voice = new ReadAloud();
let pickerReady = false;
// Tell the server which natural voice this listener hears, so it only makes audio people use.
let sock = null;
function sendListen() {
  if (sock?.readyState === 1) sock.send(JSON.stringify({ type: 'listen', voice: voice.on && voice.ai ? voice.ai.voice : null }));
}
voice.onAI = () => { audioById.clear(); sendListen(); };
const audioById = new Map(), waitingAudio = new Map();   // natural voice: line id -> mp3 url / render time
function setupPicker(m) {
  if (pickerReady) return; pickerReady = true;
  // The organiser's natural voice is made once on the server for everyone; device voices are the backup.
  voicePicker($('#voice'), $('#vtest'), null, voice, m.naturalVoice ? (m.voices || [{ id: m.voice, label: 'Natural voice' }]) : null);
}
const store = { get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
                set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

const shown = [];
let pending = [], interimEl = null, info = { title: '', startsAt: null, live: false }, hasLines = false;
let delay = store.get('lt-delay', 0), size = store.get('lt-size', 34);

// ---------- settings (big +/- buttons) ----------
function applySettings() {
  $('#feed').style.setProperty('--fs', size + 'px');
  // A delay is easy to forget (it is remembered between visits), so always show it when on.
  $('#delayTag').classList.toggle('hidden', !delay);
  $('#delayTag').innerHTML = '&#9201; ' + delay + ' s delay';
  $('#szVal').textContent = size <= 28 ? 'Normal' : size <= 36 ? 'Large' : size <= 44 ? 'Larger' : 'Largest';
  $('#rtVal').textContent = voice.rate <= 0.8 ? 'Slow' : voice.rate <= 0.95 ? 'Calm' : voice.rate <= 1.1 ? 'Normal' : 'Fast';
  $('#dlVal').textContent = delay ? delay + ' seconds' : 'No delay';
  store.set('lt-delay', delay); store.set('lt-size', size);
}
$('#szDown').onclick = () => { size = Math.max(22, size - 4); applySettings(); };
$('#szUp').onclick = () => { size = Math.min(56, size + 4); applySettings(); };
$('#rtDown').onclick = () => { voice.setRate(Math.max(0.7, +(voice.rate - 0.1).toFixed(2))); applySettings(); voice.say('This is the speaking speed.', true); };
$('#rtUp').onclick = () => { voice.setRate(Math.min(1.4, +(voice.rate + 0.1).toFixed(2))); applySettings(); voice.say('This is the speaking speed.', true); };
$('#dlDown').onclick = () => { delay = Math.max(0, delay - 5); applySettings(); };
$('#dlUp').onclick = () => { delay = Math.min(60, delay + 5); applySettings(); };
$('#hiBox').onchange = () => document.body.classList.toggle('show-hi', $('#hiBox').checked);
$('#gear').onclick = () => $('#panel').classList.add('open');
$('#delayTag').onclick = () => { $('#panel').classList.add('open'); $('#dlDown').scrollIntoView({ block: 'center' }); };
$('#closePanel').onclick = () => $('#panel').classList.remove('open');
$('#dl').onclick = () => download(`transcript-${code}.txt`, transcriptText(shown, info.title));
applySettings();

// ---------- event video: watched straight from Cloudflare (WebRTC), always muted ----------
const VSIZES = ['off', 'small', 'medium', 'large'];
const VIDEO_DELAY_MS = 2500;   // hold the picture back a little so it lines up with the English
let videoUrl = null, vsize = store.get('lt-video', 'small'), vpc = null, vretry = null, vtoken = 0;
const vid = $('#vid');
const keepMuted = () => { if (!vid.muted) vid.muted = true; if (vid.volume) vid.volume = 0; };
vid.addEventListener('volumechange', keepMuted);
const wantVideo = () => !!videoUrl && vsize !== 'off';
function vwait(t) { $('#vwait').textContent = t || ''; $('#vwait').style.display = t ? '' : 'none'; }
function closeVideo() {
  clearTimeout(vretry); vtoken++;
  if (vpc) { try { vpc.close(); } catch {} vpc = null; }
  vid.srcObject = null;
}
function retryVideo(ms, msg) { vwait(msg); clearTimeout(vretry); vretry = setTimeout(() => { if (wantVideo()) openVideo(); }, ms); }
async function openVideo() {
  closeVideo();
  const my = vtoken;
  vwait('Connecting the video...');
  try {
    const pc = vpc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }], bundlePolicy: 'max-bundle' });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });   // the video's own sound is never played
    pc.ontrack = (e) => {
      try { e.receiver.jitterBufferTarget = VIDEO_DELAY_MS; } catch {}
      if (e.track.kind !== 'video') return;
      vid.srcObject = new MediaStream([e.track]);   // picture only
      keepMuted(); vid.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      if (my !== vtoken) return;
      if (pc.connectionState === 'connected') vwait('');
      if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') retryVideo(3000, 'Reconnecting the video...');
    };
    await pc.setLocalDescription(await pc.createOffer());
    await new Promise((r) => {
      if (pc.iceGatheringState === 'complete') return r();
      const t = setTimeout(r, 2000);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); r(); } });
    });
    const r = await fetch(videoUrl, { method: 'POST', headers: { 'Content-Type': 'application/sdp' }, body: pc.localDescription.sdp });
    if (my !== vtoken) return;
    if (!r.ok) throw new Error('status ' + r.status);
    await pc.setRemoteDescription({ type: 'answer', sdp: await r.text() });
  } catch {
    if (my === vtoken) retryVideo(5000, 'Waiting for the video...');
  }
}
function applyVideo() {
  document.body.dataset.video = wantVideo() ? vsize : 'off';
  $('#videoSet').classList.toggle('hidden', !videoUrl);
  $('#vsVal').textContent = { off: 'Off', small: 'Small', medium: 'Medium', large: 'Large' }[vsize];
  if (wantVideo()) { if (!vpc) openVideo(); } else closeVideo();   // Off: nothing is downloaded
  requestAnimationFrame(() => { const f = $('#feed'); f.scrollTop = f.scrollHeight; });   // keep the newest line in view
}
function setVideo(url) { if ((url || null) === videoUrl) return; videoUrl = url || null; closeVideo(); applyVideo(); }
$('#vsDown').onclick = () => { vsize = VSIZES[Math.max(0, VSIZES.indexOf(vsize) - 1)]; store.set('lt-video', vsize); applyVideo(); };
$('#vsUp').onclick = () => { vsize = VSIZES[Math.min(VSIZES.length - 1, VSIZES.indexOf(vsize) + 1)]; store.set('lt-video', vsize); applyVideo(); };
applyVideo();

// ---------- listen button ----------
function listenLabel() {
  $('#listen').classList.toggle('on', voice.on);
  $('#listen').innerHTML = voice.on ? '&#128266; English sound is ON &middot; tap to stop' : '&#128264; Tap to hear English';
}
// ---------- automatic update after a deploy ----------
let pageBuild = null, reloading = false;
function reloadForUpdate() {
  if (reloading) return;
  reloading = true;
  try { sessionStorage.setItem('lt-resume', JSON.stringify({ sound: voice.on })); } catch {}
  // spread the reloads over a few seconds so hundreds of listeners don't all hit the server at once
  setTimeout(() => location.reload(), 500 + Math.random() * 6000);
}
// After an update reload, switch the English sound back on if the browser allows it without a tap;
// otherwise the big button asks for one tap.
(function resumeAfterUpdate() {
  let r = null;
  try { r = JSON.parse(sessionStorage.getItem('lt-resume') || 'null'); sessionStorage.removeItem('lt-resume'); } catch {}
  if (!r?.sound) return;
  const el = voice.player.el;
  el.muted = false;
  el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
  el.play().then(() => { if (!voice.on) { voice.toggle(); listenLabel(); sendListen(); } })
    .catch(() => {
      $('#listen').innerHTML = '&#128264; The page was updated &middot; tap to hear English again';
      $('#listen').classList.add('pulse');
    });
})();
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let heard = false;
$('#listen').onclick = () => {
  $('#listen').classList.remove('pulse');
  voice.toggle(); listenLabel(); sendListen();
  if (vid.srcObject) vid.play().catch(() => {});   // phones need a tap before video plays
  heard = false;
  // If nothing has been spoken a few seconds after turning sound on, show phone-specific help.
  if (voice.on) setTimeout(() => { if (voice.on && !heard) $('#soundHelp').classList.remove('hidden'); }, 4000);
  else $('#soundHelp').classList.add('hidden');
};
voice.onState = (st, err) => {
  if (st === 'speaking') { heard = true; $('#soundHelp').classList.add('hidden'); }
  if (st === 'error') { setState('Sound problem - open Settings and pick another voice', 'paused'); $('#soundHelp').classList.remove('hidden'); }
  if (st === 'stuck') { $('#soundHelpText').innerHTML = '<b>The voice on this device is not responding.</b> Close this browser completely (all windows), open it again and come back to this link.'; $('#soundHelp').classList.remove('hidden'); }
};
$('#soundHelpText').innerHTML = isIOS
  ? '<b>No sound?</b> Flip the <b>silent switch</b> on the side of your iPhone (no orange showing) and turn the volume up. Then tap the blue button twice.'
  : '<b>No sound?</b> Turn your volume up, check this browser tab is not muted, then tap the blue button twice.';
$('#soundHelpClose').onclick = () => $('#soundHelp').classList.add('hidden');

// ---------- screens ----------
function setState(text, cls = '') { $('#stateText').textContent = text; $('#stateText').className = cls; }

let tick = null;
function showWaiting() {
  if (hasLines) return;
  const feed = $('#feed');
  const when = info.startsAt ? new Date(info.startsAt) : null;
  feed.innerHTML = `<div class="waiting">
      <div class="muted" style="font-size:18px">You are in the right place</div>
      <div class="big"></div>
      ${when ? '<div class="when"></div><div class="count" id="countdown"></div>' : ''}
      <p>Keep this page open. The English will appear here by itself when the event starts.</p>
      <p>Tap the <b>blue button below</b> now if you want to <b>hear</b> the English, not just read it.</p>
    </div>`;
  feed.querySelector('.big').textContent = info.title || 'The event will start soon';
  if (when) {
    feed.querySelector('.when').textContent = 'Starts ' + when.toLocaleString([], { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' (your time)';
    clearInterval(tick);
    const upd = () => {
      const el = document.getElementById('countdown'); if (!el) return clearInterval(tick);
      let s = Math.round((when - Date.now()) / 1000);
      if (s <= 0) { el.textContent = 'Starting now\u2026'; return; }
      const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
      el.textContent = d ? `${d} day${d > 1 ? 's' : ''} ${h} hr` : h ? `${h} hr ${m} min` : `${m}:${String(sec).padStart(2, '0')}`;
    };
    upd(); tick = setInterval(upd, 1000);
  }
}

function clearWaiting() { if (!hasLines) { $('#feed').innerHTML = ''; clearInterval(tick); hasLines = true; } }

function render(line, speak) {
  clearWaiting();
  const feed = $('#feed');
  interimEl?.remove(); interimEl = null;
  feed.querySelectorAll('.latest').forEach(x => x.classList.remove('latest'));
  const d = document.createElement('div');
  d.className = 'sub latest';
  d.innerHTML = '<div class="hi"></div><div class="en"></div>';
  d.querySelector('.hi').textContent = line.hi;
  if (!line.en) return;  // nothing to show or say
  d.querySelector('.en').textContent = line.en;
  feed.appendChild(d);
  while (feed.children.length > 200) feed.firstChild.remove();
  d.scrollIntoView({ behavior: 'smooth', block: 'center' });
  shown.push(line);
  if (speak) {
    if (voice.ai) {
      const url = audioById.get(line.id);
      if (url) voice.playAudio(url, line.en); else waitingAudio.set(line.id, { t: Date.now(), text: line.en });
      // speech covers whole sentences, so most chunk ids never get audio; forget old ones
      for (const [k, v] of waitingAudio) if (Date.now() - v.t > 30000) waitingAudio.delete(k);
    } else voice.say(line.en);
  }
}

function showInterim(hi) {
  if (delay > 0 || !hi || !document.body.classList.contains('show-hi')) { interimEl?.remove(); interimEl = null; return; }
  clearWaiting();
  if (!interimEl) { interimEl = document.createElement('div'); interimEl.className = 'interim'; $('#feed').appendChild(interimEl); }
  interimEl.textContent = '\u2026 ' + hi;
}

function liveState(live) {
  info.live = live;
  $('#dot').classList.toggle('on', live);
  if (live) setState('Live now');
  else if (hasLines) setState('Paused - the English will continue soon', 'paused');
  else setState(info.startsAt && info.startsAt > Date.now() ? 'Not started yet' : 'Waiting for the organiser');
}

// release delayed lines when their time comes
setInterval(() => {
  const now = Date.now();
  while (pending.length && pending[0].at + delay * 1000 <= now) render(pending.shift().line, true);
}, 200);

function connect() {
  const ws = sock = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?room=${code}`);
  ws.addEventListener('open', sendListen);
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'video') setVideo(m.url);
    if (m.type === 'hello') {
      if (!pageBuild) pageBuild = m.build;
      else if (m.build && m.build !== pageBuild) return reloadForUpdate();
      setVideo(m.video);
      setupPicker(m);
      info = { title: m.title, startsAt: m.startsAt, live: m.live };
      if (m.title) { $('#title').textContent = m.title; document.title = m.title + ' \u00b7 English'; }
      $('#feed').innerHTML = ''; shown.length = 0; pending = []; hasLines = false;
      if (m.history.length) m.history.forEach(l => render(l, false)); else showWaiting();
      liveState(m.live);
      showInterim(m.interim);
    }
    if (m.type === 'status') liveState(m.live);
    if (m.type === 'final') { if (!info.live) liveState(true); pending.push({ at: Date.now(), line: m.line }); }
    if (m.type === 'interim') showInterim(m.hi);
    if (m.type === 'audio') {
      audioById.set(m.id, m.url);
      while (audioById.size > 100) audioById.delete(audioById.keys().next().value);
      const w = waitingAudio.get(m.id);
      if (w) { waitingAudio.delete(m.id); if (Date.now() - w.t < 25000) voice.playAudio(m.url, w.text); }
    }
    if (m.type === 'clear') { $('#feed').innerHTML = ''; pending = []; hasLines = false; showWaiting(); }
    if (m.type === 'error' || m.type === 'closed') {
      ws.onclose = null; $('#dot').classList.remove('on'); clearInterval(tick);
      setState(m.type === 'closed' ? 'This event has ended' : 'Link not found');
      if (!shown.length) $('#feed').innerHTML = `<div class="waiting"><div class="big">${m.type === 'closed' ? 'This event has ended' : 'We could not find this event'}</div><p>${m.type === 'closed' ? 'Thank you for joining.' : 'Please check the link with the person who sent it to you.'}</p></div>`;
      $('#listen').classList.add('hidden');
    }
  };
  ws.onclose = () => { $('#dot').classList.remove('on'); setState('Reconnecting...', 'paused'); setTimeout(connect, 1500); };
}
connect();
listenLabel();
</script>
</body>
</html>
